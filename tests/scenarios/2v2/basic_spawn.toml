# Test: 2v2 Basic Spawn
# Verifies 4 players can spawn and coexist in the arena
#
# FAIL conditions this test catches:
# - Spawning fails with 4 players
# - Players overlap or clip through each other at start
# - Basic movement works for all 4 players

name = "2v2 Basic Spawn"
description = "Four players spawn correctly and can move independently"

[setup]
level = "test_flat_floor"

# Left team - two players
[[setup.entities]]
type = "player"
id = "L0"
team = "left"
x = -300.0
y = -350.0

[[setup.entities]]
type = "player"
id = "L1"
team = "left"
x = -200.0
y = -350.0

# Right team - two players
[[setup.entities]]
type = "player"
id = "R0"
team = "right"
x = 200.0
y = -350.0

[[setup.entities]]
type = "player"
id = "R1"
team = "right"
x = 300.0
y = -350.0

# All 4 players move toward center
[[input]]
frame = 0
L0 = { move_right = true }
L1 = { move_right = true }
R0 = { move_left = true }
R1 = { move_left = true }

[[input]]
frame = 30
L0 = { move_right = false }
L1 = { move_right = false }
R0 = { move_left = false }
R1 = { move_left = false }

# Verify all 4 players moved from their starting positions
[[expect.state]]
after_frame = 40
checks = [
    "L0.x > -300",    # L0 moved right from start
    "L1.x > -200",    # L1 moved right from start
    "R0.x < 200",     # R0 moved left from start
    "R1.x < 300",     # R1 moved left from start
]
