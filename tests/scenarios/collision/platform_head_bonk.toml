# Test: Player head bonk on platform from below
# Verifies that jumping into a platform from below stops upward movement
#
# FAIL conditions this test catches:
# - Player passes through platform from below
# - Upward velocity not stopped by collision
# - Collision only works from above

name = "Platform head bonk"
description = "Jumping into platform from below stops player"

[setup]
level = "test_high_platform"
# Platform center at y=-150 (ARENA_FLOOR_Y + 300), size 150x20
# Platform bottom at -160
# Player jump peak ~215 units above ground, reaches ~-151.5, top at ~-87.5
# So player top passes platform bottom and hits ceiling

# Spawn player on the floor, directly below platform
# Floor top at -430 (center -450, half-height 20)
# Player half-height=64, ground level = -430 + 64 - 0.5 = -366.5
[[setup.entities]]
type = "player"
id = "p1"
team = "left"
x = 0.0
y = -366.5

# Jump straight up (into platform above)
[[input]]
frame = 5
p1 = { jump = true }

# Check at frame 10 - should be in the air, rising
# Player has ~142.5 units of clearance before hitting platform
[[expect.state]]
after_frame = 10
checks = [
    "p1.grounded = false",    # In the air
    "p1.y > -340",            # Has risen significantly from ground (~-366.5)
]

# Check at frame 30 - should NOT have passed through platform
# Platform center at -150, player should be below it
[[expect.state]]
after_frame = 30
checks = [
    "p1.y < -150",            # Didn't pass through platform center
]

# Check at frame 60 - should have fallen back to ground
[[expect.state]]
after_frame = 60
checks = [
    "p1.grounded = true",     # Back on ground
    "p1.y < -364",            # Near floor level (~-366.5)
    "p1.y > -370",            # Not too far below
]
