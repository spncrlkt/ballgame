# Test: AI goal transition sequence validation
# Validates that game supports the state sequence AI would produce:
# ChaseBall → Pickup → AttackWithBall (move toward basket) → ChargeShot → Score
#
# Note: This test uses manual input to simulate expected AI goal transitions.
# Full AI testing requires the training workflow audit with SQLite event analysis.

name = "AI goal transition sequence (behavior validation)"
description = "Validates pickup → move → shoot → score sequence that AI should produce"

[setup]
level = "test_flat_floor"

# Player on left side
[[setup.entities]]
type = "player"
id = "attacker"
team = "left"
x = -300.0
y = -350.0
facing = 1.0

# Ball nearby
[[setup.entities]]
type = "ball"
x = -250.0
y = -350.0

# Phase 1: ChaseBall - move toward ball
[[input]]
frame = 0
attacker = { move_right = true }

# Phase 2: Pickup ball
[[input]]
frame = 20
attacker = { move_right = false, pickup = true }

# Phase 3: AttackWithBall - move toward basket (right side for left team)
[[input]]
frame = 30
attacker = { move_right = true }

# Continue moving toward basket
[[input]]
frame = 60
attacker = { move_right = true }

# Phase 4: ChargeShot - stop and charge throw
[[input]]
frame = 90
attacker = { move_right = false, throw_held = true }

# Release throw after charging
[[input]]
frame = 150
attacker = { throw_held = false }

# Verify Phase 2: Pickup occurred
[[expect.sequence]]
event = "Pickup"
player = "attacker"
frame_min = 15
frame_max = 30

# Verify Phase 3: Player moved toward basket
[[expect.state]]
after_frame = 80
checks = [
    "attacker.x > -100",  # Moved right toward opponent basket
    "attacker.holding_ball = true",
]

# Verify Phase 4: Shot released
[[expect.sequence]]
event = "ShotRelease"
frame_min = 140
frame_max = 180

# Verify ball is now in flight
[[expect.state]]
after_frame = 160
checks = [
    "attacker.holding_ball = false",
    "ball.state = InFlight",
]
